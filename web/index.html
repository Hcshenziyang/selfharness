<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DogOHarness · 对话</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- ******************************** 会话导航与 MCP 服务 ******************************** -->
    <nav id="sidebar" class="sidebar" aria-label="会话与 MCP 服务">
      <div class="sidebar-heading">
        <button id="brand-home" class="brand" type="button" aria-label="DogOHarness 新对话">
          <span class="brand-logo" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M8 10a4 4 0 014-4h4a4 4 0 014 4v4a6 6 0 01-6 6h0a6 6 0 01-6-6v-4z" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.5" fill="#3b3228"/>
              <circle cx="16" cy="12" r="1.5" fill="#3b3228"/>
            </svg>
          </span>
          <span class="brand-text">DogO<span class="brand-light">Harness</span></span>
        </button>
        <button id="close-sidebar" class="btn-icon mobile-only" type="button" aria-label="关闭侧栏">×</button>
      </div>

      <div class="sidebar-section">
        <div class="agent-picker">
          <div class="agent-heading">
            <label class="sidebar-label" for="agent-select">助手</label>
            <button type="button" id="new-agent" disabled>新建助手</button>
            <button type="button" id="edit-agent" disabled>编辑</button>
          </div>
          <select id="agent-select" disabled></select>
        </div>
        <section id="conversation-history" aria-labelledby="history-label" hidden>
          <p id="history-label" class="sidebar-label">历史会话</p>
          <div id="conversation-list" class="conversation-list"></div>
        </section>
        <button id="edit-tools" class="sidebar-action" type="button" aria-haspopup="dialog" aria-controls="tool-dialog" disabled>内置工具与工作目录</button>
        <p class="sidebar-label">MCP 服务</p>
        <p id="server-list-error" class="feedback error" role="alert" hidden></p>
        <button id="retry-servers" class="sidebar-action" type="button" hidden>重新加载服务列表</button>
        <div id="servers" class="servers" aria-live="polite"></div>

        <button id="toggle-form" class="sidebar-action" type="button" disabled aria-expanded="false" aria-haspopup="dialog" aria-controls="server-dialog">
          <svg class="sidebar-action-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="sidebar-action-text">添加服务</span>
        </button>

      </div>
    </nav>

    <!-- ******************************** 聊天与消息输入 ******************************** -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-header-left">
          <button id="sidebar-toggle" class="btn-icon mobile-only" type="button" aria-label="打开侧边栏" aria-controls="sidebar" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <h1 id="conversation-title">对话</h1>
        </div>
        <div class="chat-header-actions">
          <details id="conversation-menu" class="conversation-menu" hidden>
            <summary class="btn btn-ghost" aria-label="会话操作">⋯</summary>
            <div class="menu-items">
              <button id="rename-chat" type="button">重命名</button>
              <button id="delete-chat" type="button">删除会话</button>
            </div>
          </details>
          <button id="new-chat" class="btn btn-ghost" type="button">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            新建对话
          </button>
        </div>
      </header>

      <!-- app.js 在这里渲染历史消息、等待回复的气泡和排队提示。 -->
      <div class="chat-scroll-wrap">
        <div id="chat-scroll" class="chat-scroll" aria-live="polite">
          <div id="empty-chat" class="empty-chat">
            <div class="empty-graphic" aria-hidden="true">
              <div class="empty-orb"></div>
              <svg class="empty-icon" width="48" height="48" viewBox="0 0 28 28" fill="none">
                <path d="M6 8C6 5.79 7.79 4 10 4h8c2.21 0 4 1.79 4 4v6c0 4.42-3.58 8-8 8h-2c-3.31 0-6-2.69-6-6V8z" fill="currentColor" opacity=".3"/>
                <path d="M8 10a4 4 0 014-4h4a4 4 0 014 4v4a6 6 0 01-6 6h0a6 6 0 01-6-6v-4z" fill="currentColor"/>
                <circle cx="12" cy="12" r="1.5" fill="var(--bg-primary)"/>
                <circle cx="16" cy="12" r="1.5" fill="var(--bg-primary)"/>
              </svg>
            </div>
            <h2>你好，有什么可以帮你的？</h2>
            <p>输入消息开始对话，或者先在左侧连接一个 MCP 服务。</p>
          </div>
          <div id="messages" class="messages"></div>
        </div>

        <button id="scroll-bottom" class="scroll-fab" type="button" aria-label="滚动到底部" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="composer-area">
        <div id="chat-error" class="error-banner" role="alert" hidden>
          <svg class="error-banner-icon" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v4M8 10.5v.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span id="chat-error-text"></span>
          <button id="dismiss-error" class="error-dismiss" type="button" aria-label="关闭">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <form id="chat-form" class="composer">
          <label class="visually-hidden" for="message-input">输入消息</label>
          <textarea id="message-input" rows="1" placeholder="输入消息…" required></textarea>
          <div class="composer-actions">
            <span class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行</span>
            <button id="send-message" class="btn-send" disabled type="submit" aria-label="发送">
              <svg class="send-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h12M11 5l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
  <dialog id="agent-dialog" class="settings-dialog" aria-labelledby="agent-form-title">
    <form id="agent-form" class="settings-form">
      <div class="form-heading">
        <h2 id="agent-form-title">编辑助手</h2>
        <button id="close-agent" class="btn-icon" type="button" aria-label="关闭助手设置">×</button>
      </div>
      <label for="agent-name">助手名称</label>
      <input id="agent-name" name="name" required autocomplete="off">
      <label for="agent-model">模型 ID</label>
      <input id="agent-model" name="model" required autocomplete="off" spellcheck="false">
      <label for="agent-instructions">指令</label>
      <textarea id="agent-instructions" name="instructions" rows="3" placeholder="这个助手负责什么，应该怎样回答"></textarea>
      <label for="agent-memory">私有记忆 <span>该助手的各段会话共用，最多 4000 字符</span></label>
      <textarea id="agent-memory" name="memory" rows="4"></textarea>
      <p id="agent-error" class="feedback error" role="alert" hidden></p>
      <button id="save-agent" class="btn btn-primary btn-full" type="submit">保存</button>
    </form>
  </dialog>
  <dialog id="tool-dialog" class="settings-dialog" aria-labelledby="tool-title">
    <form id="tool-form" class="settings-form">
      <div class="form-heading">
        <h2 id="tool-title">内置工具与工作目录</h2>
        <button id="close-tools" class="btn-icon" type="button" aria-label="关闭工具设置">×</button>
      </div>
      <label><input type="checkbox" name="echo"> 回声测试 <code>echo</code></label>
      <label><input type="checkbox" name="memory_update"> 允许助手更新私有记忆</label>
      <label for="workspace-root">文件工作目录 <span>本机已有目录的绝对路径</span></label>
      <input id="workspace-root" name="workspace_root" type="text" autocomplete="off" spellcheck="false">
      <label><input type="checkbox" name="read_file"> 读取目录内的文本文件</label>
      <label><input type="checkbox" name="write_file"> 创建或替换目录内的文本文件</label>
      <p class="edit-hint">此目录约束内置文件工具。外部 MCP 服务使用各自的进程权限或远端凭据。</p>
      <p id="tool-error" class="feedback error" role="alert" hidden></p>
      <button id="save-tools" class="btn btn-primary btn-full" type="submit">保存</button>
    </form>
  </dialog>
  <dialog id="server-dialog" class="settings-dialog" aria-labelledby="server-form-title">
    <form id="server-form" class="settings-form">
      <div class="form-heading">
        <h2 id="server-form-title">连接 MCP 服务</h2>
        <button id="cancel-form" class="btn-icon" type="button" aria-label="关闭配置">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <p id="edit-hint" class="edit-hint" hidden>此标签页没有原配置。请填写完整配置及所需凭据，新连接成功后生效。</p>
      <label for="server-name">服务名称</label>
      <input id="server-name" name="name" placeholder="例如 local" autocomplete="off" required>

      <label for="server-type">连接方式</label>
      <div class="select-wrap">
        <select id="server-type" name="type">
          <option value="stdio">stdio · 本地进程</option>
          <option value="http">Streamable HTTP</option>
        </select>
      </div>

      <div id="stdio-fields" class="form-fields">
        <label for="server-command">启动命令</label>
        <input id="server-command" placeholder="例如 python3" autocomplete="off" required>
        <label for="server-args">参数 <span>每行一项</span></label>
        <textarea id="server-args" rows="2" placeholder="examples/mcp_demo.py"></textarea>
        <label for="server-cwd">工作目录 <span>可选</span></label>
        <input id="server-cwd" placeholder="默认使用服务启动目录" autocomplete="off">
        <label for="server-env">环境变量 <span>可选，每行 KEY=VALUE</span></label>
        <textarea id="server-env" rows="2" spellcheck="false" autocomplete="off" placeholder="SERVER_KEY=..."></textarea>
      </div>

      <div id="http-fields" class="form-fields" hidden>
        <label for="server-url">服务地址</label>
        <input id="server-url" type="url" placeholder="http://127.0.0.1:8765/mcp" autocomplete="off" disabled>
        <label for="server-token">Bearer Token <span>可选</span></label>
        <input id="server-token" type="password" autocomplete="off" disabled>
        <label for="server-headers">其他请求头 <span>可选，每行名称: 值</span></label>
        <textarea id="server-headers" rows="2" spellcheck="false" autocomplete="off" placeholder="X-API-Key: ..." disabled></textarea>
      </div>

      <label><input id="server-parallel" type="checkbox"> 允许此服务的所有工具并发执行</label>
      <p id="server-error" class="feedback error" role="alert" hidden></p>
      <button id="connect-server" class="btn btn-primary btn-full" type="submit">连接</button>
    </form>
  </dialog>
</body>
</html>
